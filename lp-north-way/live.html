/* ======================================================
   1. VARIÁVEIS GLOBAIS
   ====================================================== */
:root{
  /* cores — identidade NorthWay: preto, branco e vermelho */
  --bg: #0C0C0C;
  --bg-soft: #161616;
  --paper: #FFFFFF;
  --paper-alt: #F4F4F4;
  --ink: #101010;
  --ink-soft: #5B5B5B;
  --white: #FAFAFA;
  --white-soft: rgba(250,250,250,0.66);
  --accent: #E31B23;
  --accent-soft: rgba(227,27,35,0.12);
  --line-dark: rgba(250,250,250,0.12);
  --line-light: rgba(16,16,16,0.10);
  --danger: #B5453E;

  /* tipografia */
  --font-display: 'Inter', 'Segoe UI', sans-serif;
  --font-body: 'Inter', 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;

  /* layout */
  --max-w: 1180px;
  --radius: 4px;
  --gap: clamp(1.25rem, 3vw, 2rem);
}

/* ======================================================
   2. RESET E BASE
   ====================================================== */
*, *::before, *::after{ box-sizing: border-box; margin: 0; padding: 0; }

html{ scroll-behavior: smooth; }

body{
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

img{ max-width: 100%; display: block; }

a{ color: inherit; text-decoration: none; }

ul{ list-style: none; }

button{ font-family: inherit; cursor: pointer; border: none; background: none; }

.container{
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 1.5rem;
}

section{ padding: clamp(3.5rem, 8vw, 6.5rem) 0; }

h1, h2, h3, h4{
  font-family: var(--font-display);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.015em;
}

.eyebrow{
  font-family: var(--font-mono);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.eyebrow::before{
  content: '';
  width: 1.25rem;
  height: 1px;
  background: var(--accent);
}

.section-head{
  max-width: 640px;
  margin-bottom: clamp(2rem, 5vw, 3rem);
}

.section-head.center{ margin-left: auto; margin-right: auto; text-align: center; }

.section-head h2{ font-size: clamp(1.7rem, 4vw, 2.5rem); margin-bottom: 0.9rem; }

.section-head p{ color: var(--ink-soft); font-size: 1.05rem; }

.on-dark .section-head p{ color: var(--white-soft); }

/* ======================================================
   3. UTILITÁRIOS
   ====================================================== */
.dark{ background: var(--bg); color: var(--white); }

.btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.95rem;
  padding: 0.95rem 1.75rem;
  border-radius: var(--radius);
  transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  white-space: nowrap;
}

.btn-primary{
  background: var(--accent);
  color: #FFFFFF;
}

.btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 10px 24px -8px rgba(227,27,35,0.55); }

.btn-outline{
  background: transparent;
  border: 1px solid var(--line-dark);
  color: var(--white);
}

.on-light .btn-outline, .btn-outline.on-light{
  border-color: var(--line-light);
  color: var(--ink);
}

.btn-outline:hover{ border-color: var(--accent); color: var(--accent); }

.btn-block{ width: 100%; }

.microcopy{
  font-size: 0.82rem;
  color: var(--ink-soft);
  margin-top: 0.85rem;
}

.dark .microcopy{ color: var(--white-soft); }

/* animações de entrada */
.reveal{
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}

.reveal.is-visible{ opacity: 1; transform: translateY(0); }

@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior: auto; }
  .reveal{ opacity: 1; transform: none; transition: none; }
  *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

/* ======================================================
   4. BARRA SUPERIOR
   ====================================================== */
.topbar{
  background: var(--ink);
  color: var(--white-soft);
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  padding: 0.55rem 1rem;
  text-transform: uppercase;
}

/* ======================================================
   5. HEADER
   ====================================================== */
header.site{
  background: var(--paper);
  border-bottom: 1px solid var(--line-light);
  position: sticky;
  top: 0;
  z-index: 40;
}

.nav{
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 0;
}

.logo{
  display: inline-flex;
  align-items: center;
}

.logo img{ height: 32px; width: auto; display: block; }

/* usada apenas como alternativa textual (ex.: rodapé sem espaço para imagem) */
.logo-text{
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.1rem;
  color: var(--ink);
  letter-spacing: -0.02em;
}

.logo-text span{ color: var(--accent); }

.nav .btn-primary{ padding: 0.65rem 1.3rem; font-size: 0.85rem; }
