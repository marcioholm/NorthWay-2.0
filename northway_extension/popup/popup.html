<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="nw-popup">
        <!-- HEADER -->
        <div class="nw-popup-header">
            <div class="nw-header-row">
                <div class="nw-logo-box">
                    <div class="nw-logo-icon-small">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M13 3L21 11M21 11L13 19M21 11H3"></path>
                        </svg>
                    </div>
                    <span class="nw-header-title">NorthWay CRM</span>
                </div>
                <div class="nw-connection-status offline" title="Desconectado"></div>
            </div>
        </div>

        <!-- AUTH VIEW (Login) -->
        <div id="nw-view-auth" class="nw-view">
            <div class="nw-hero">
                <h1>Acesse sua<br><span>Operação</span></h1>
                <p>ZapWay Extension v4.0.7</p>
            </div>

            <div id="nw-login-form" class="nw-auth-card glass-panel">
                <div id="nw-error-msg" class="nw-error-box hidden"></div>
                
                <div class="nw-input-group">
                    <input type="email" id="nw-email" placeholder="E-mail Corporativo" autocomplete="off">
                </div>
                <div class="nw-input-group">
                    <input type="password" id="nw-password" placeholder="Chave de Acesso" autocomplete="off">
                </div>
                
                <button id="nw-btn-login" class="nw-btn primary" style="margin-top: 24px;">Autenticar Acesso</button>
            </div>
        </div>

        <!-- ACTIVE VIEW (Logged In) -->
        <div id="nw-view-active" class="nw-view hidden">
            
            <!-- User Profile Center -->
            <div class="nw-user-profile glass-panel" style="padding: 24px;">
                <div class="nw-user-avatar">
                    <img id="nw-user-img" src="" class="hidden" width="56" height="56">
                    <span id="nw-user-initials">AD</span>
                </div>
                <div id="nw-user-name">Usuário Operador</div>
                <div id="nw-user-email">email@northway.com</div>
            </div>

            <!-- Stats (Bug 13) -->
            <div class="nw-stats-row">
                <!-- Disparos -->
                <div class="nw-stat-card">
                    <div id="nw-popup-sent" class="nw-stat-value">0</div>
                    <div class="nw-stat-label">Disparos</div>
                </div>

                <!-- Leads -->
                <div class="nw-stat-card mint">
                    <div id="nw-popup-crm" class="nw-stat-value">0</div>
                    <div class="nw-stat-label">Leads CRM</div>
                </div>
            </div>

            <a href="https://web.whatsapp.com" target="_blank" class="nw-btn primary" style="text-decoration: none; margin-bottom: 12px;">
                Abrir WhatsApp Web
            </a>

            <button id="nw-btn-logout" class="nw-btn outline">
                Desconectar
            </button>
        </div>

        <!-- FOOTER -->
        <div class="nw-popup-footer">
            <span class="nw-version">v4.0.7</span>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
