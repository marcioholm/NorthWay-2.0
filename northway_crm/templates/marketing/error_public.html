<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Expirado - NorthWay CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #121217;
            color: white;
            font-family: sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="h-screen flex items-center justify-center p-6">
    <div class="glass border border-white/10 rounded-3xl p-12 max-w-md w-full text-center shadow-2xl">
        <div class="w-20 h-20 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
            <i data-lucide="clock" class="w-10 h-10 text-red-500"></i>
        </div>
        <h1 class="text-2xl font-bold mb-4">Link Expirado</h1>
        <p class="text-white/60 mb-8">Esta apresentação comercial não está mais disponível. Os links temporários expiram
            após 7 dias por segurança.</p>
        <div class="pt-6 border-t border-white/10">
            <p class="text-xs text-white/40 uppercase tracking-widest font-bold">NorthWay CRM</p>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>

</html>
