<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <title>Raio-X NorthWay | Diagnóstico Comercial</title>
  <meta name="description" content="Descubra em 1 minuto onde está o maior gargalo da sua empresa e receba o plano de ação no WhatsApp." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --red: #FA0102;
      --red-hover: #D90001;
      --red-soft: #FEF2F2;
      --red-border: #FECACA;
      --ink: #0F172A;
      --ink-2: #334155;
      --muted: #64748B;
      --line: #E2E8F0;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --ok: #15803D;
      --ok-soft: #F0FDF4;
      --warn: #B45309;
      --warn-soft: #FFFBEB;
      --radius-lg: 16px;
      --radius-md: 12px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.05), 0 10px 30px rgba(15, 23, 42, 0.04);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation Bar */
    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .navbar-inner {
      max-width: 920px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: var(--red);
      flex-shrink: 0;
    }

    .step-pill {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-2);
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 5px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .progress-track {
      height: 3px;
      background: var(--line);
      width: 100%;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--red);
      transition: width 0.3s ease;
    }

    /* Main Container */
    .shell {
      min-height: calc(100dvh - 56px);
      display: flex;
      flex-direction: column;
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 16px calc(28px + env(safe-area-inset-bottom));
    }

    @media (min-width: 768px) {
      .shell {
        padding: 40px 24px 40px;
        justify-content: center;
      }
    }

    .stage {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .stage.wide {
      max-width: 860px;
    }

    /* Resume Banner */
    .resume-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      color: #92400E;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      margin-bottom: 16px;
    }

    .resume-banner button {
      background: transparent;
      border: none;
      color: #B45309;
      font-family: inherit;
      font-weight: 700;
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      box-shadow: var(--shadow);
      animation: fadeUp 0.22s ease both;
    }

    @media (min-width: 640px) {
      .card {
        padding: 36px 40px;
      }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .meta-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--red);
      margin-bottom: 10px;
      letter-spacing: 0.01em;
    }

    .area-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: #F1F5F9;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(22px, 4vw, 28px);
      line-height: 1.22;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin: 0 0 8px;
      color: var(--ink);
    }

    h2 {
      font-size: clamp(18px, 3.2vw, 22px);
      line-height: 1.32;
      font-weight: 700;
      letter-spacing: -0.015em;
      margin: 0 0 20px;
      color: var(--ink);
    }

    .sub {
      font-size: 14px;
      line-height: 1.55;
      color: var(--muted);
      margin: 0 0 22px;
    }

    /* Path Grid: 1 col mobile, 2 cols PC */
    .path-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 640px) {
      .path-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-md);
      padding: 16px;
      min-height: 60px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.12s ease;
    }

    .choice-btn:hover {
      border-color: #94A3B8;
      background: #F8FAFC;
    }

    .choice-btn:active {
      transform: scale(0.99);
    }

    .choice-btn.selected {
      border-color: var(--red);
      background: var(--red-soft);
      box-shadow: 0 0 0 3px rgba(250, 1, 2, 0.08);
    }

    .choice-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #F1F5F9;
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .choice-btn.selected .choice-icon {
      background: var(--red);
      color: #FFFFFF;
    }

    .choice-letter {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: #F1F5F9;
      color: var(--ink-2);
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .choice-btn.selected .choice-letter {
      background: var(--red);
      color: #FFFFFF;
    }

    .choice-text {
      flex: 1;
      min-width: 0;
    }

    .choice-title {
      display: block;
      font-weight: 700;
      color: var(--ink);
      font-size: 15px;
    }

    .choice-desc {
      display: block;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 2px;
    }

    .nav-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-top: 20px;
    }

    .btn-back {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      padding: 8px 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-back:hover {
      color: var(--ink);
    }

    /* Data Capture Layout (2-col on PC, stacked on mobile) */
    .dados-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 720px) {
      .dados-layout {
        grid-template-columns: 1fr 1.15fr;
        gap: 32px;
        align-items: start;
      }
    }

    .summary-panel {
      background: #F8FAFC;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 20px;
    }

    .summary-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .blurred-score-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
    }

    .blurred-num {
      font-size: 36px;
      font-weight: 800;
      color: var(--ink);
      filter: blur(8px);
      user-select: none;
    }

    .blurred-den {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }

    .summary-panel p {
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--ink-2);
      margin: 0;
    }

    .summary-checks {
      list-style: none;
      padding: 14px 0 0;
      margin: 14px 0 0;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      color: var(--ink-2);
    }

    .summary-checks li {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .summary-checks svg {
      color: var(--red);
      flex-shrink: 0;
    }

    /* Form Fields */
    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      margin-bottom: 6px;
    }

    .opt-tag {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    .field input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      color: var(--ink);
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(250, 1, 2, 0.08);
    }

    .form-error {
      background: var(--red-soft);
      border: 1px solid var(--red-border);
      color: #9F1239;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: none;
    }

    .btn-primary {
      width: 100%;
      background: var(--red);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 15px 20px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease, transform 0.12s ease;
      text-decoration: none;
      margin-top: 4px;
    }

    .btn-primary:hover {
      background: var(--red-hover);
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .privacy-note {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin: 10px 0 0;
    }

    /* Result Screen */
    .score-hero {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 22px;
    }

    @media (min-width: 600px) {
      .score-hero {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
    }

    .score-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .ring-wrap {
      position: relative;
      width: 92px;
      height: 92px;
      flex-shrink: 0;
    }

    .ring-svg {
      width: 92px;
      height: 92px;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: #E2E8F0;
      stroke-width: 8;
    }

    .ring-val {
      fill: none;
      stroke: var(--red);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 238.76;
      stroke-dashoffset: 238.76;
      transition: stroke-dashoffset 0.8s ease;
    }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .ring-num {
      font-size: 24px;
      font-weight: 800;
      color: var(--ink);
    }

    .ring-den {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 2px;
    }

    .status-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .status-critico { background: var(--red-soft); color: #B91C1C; }
    .status-construcao { background: var(--warn-soft); color: var(--warn); }
    .status-saudavel { background: var(--ok-soft); color: var(--ok); }

    .score-meta h3 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 800;
      color: var(--ink);
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 22px;
    }

    @media (min-width: 720px) {
      .result-grid {
        grid-template-columns: 1.15fr 0.85fr;
        align-items: start;
      }
    }

    .geral-highlight {
      background: #FFF7ED;
      border: 1px solid #FED7AA;
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.5;
      color: #9A3412;
    }

    .urgent-card {
      background: var(--red-soft);
      border: 1px solid var(--red-border);
      border-radius: var(--radius-md);
      padding: 18px;
    }

    .urgent-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--red);
      margin-bottom: 6px;
    }

    .urgent-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 10px;
      line-height: 1.38;
    }

    .urgent-action {
      font-size: 14px;
      line-height: 1.55;
      color: var(--ink-2);
      margin: 0;
    }

    .answers-box {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      background: #F8FAFC;
    }

    .answers-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 10px;
    }

    .ans-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .ans-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .ans-name {
      font-weight: 600;
      color: var(--ink-2);
    }

    .ans-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (min-width: 600px) {
      .result-actions {
        flex-direction: row;
        align-items: center;
      }
      .result-actions .btn-wa {
        flex: 1;
        margin-top: 0;
      }
      .result-actions .btn-ghost {
        width: auto;
        margin-top: 0;
        padding: 14px 20px;
      }
    }

    .btn-wa {
      background: #16A34A;
    }

    .btn-wa:hover {
      background: #15803D;
    }

    .btn-ghost {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 13px 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-2);
      cursor: pointer;
    }

    .btn-ghost:hover {
      background: #F8FAFC;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: auto;
      padding-top: 24px;
    }

    .footer a {
      color: var(--muted);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>Raio-X NorthWay</span>
      </div>
      <span class="step-pill" id="stepPill">Pergunta 1 de 6</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </header>

  <div class="shell">
    <div class="stage" id="stageContainer">
      <div class="resume-banner" id="resumeBanner" style="display: none;">
        <span>Continuando de onde você parou</span>
        <button type="button" onclick="resetFlow()">Recomeçar</button>
      </div>

      <main id="app"></main>
    </div>

    <footer class="footer">
      NorthWay Company · <a href="/privacidade" target="_blank" rel="noopener">Política de Privacidade</a>
    </footer>
  </div>

  <script>
    const Q = {{ v3_questions | tojson }};
    const PATHS = {{ v3_paths | tojson }};
    const RESUME_FROM_SERVER = {{ resume_data | tojson }};
    const DEFAULT_ORIGEM = {{ origem | tojson }};
    const STORAGE_KEY = 'nw_raiox_v3_progress';
    const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

    const ICONS = {
      marketing: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>',
      comercial: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
      gestao: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>',
      geral: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      check: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
      arrowLeft: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>',
      arrowRight: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>'
    };

    const PATH_CARDS = [
      { key: 'marketing', title: 'Atrair clientes', desc: 'Pouca gente chega até mim' },
      { key: 'comercial', title: 'Vender', desc: 'As pessoas chegam, mas não fecham' },
      { key: 'gestao', title: 'Organizar a empresa', desc: 'Números, metas e lucro' },
      { key: 'geral', title: 'Não sei dizer', desc: 'Quero identificar onde está o gargalo' }
    ];

    const LETTERS = ['A', 'B', 'C', 'D'];

    function newToken() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'rx_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    }

    function getUtms() {
      const p = new URLSearchParams(window.location.search);
      return {
        origem: p.get('origem') || p.get('utm_source') || DEFAULT_ORIGEM || 'direto',
        utm_source: p.get('utm_source') || null,
        utm_medium: p.get('utm_medium') || null,
        utm_campaign: p.get('utm_campaign') || null,
        utm_content: p.get('utm_content') || null,
        utm_term: p.get('utm_term') || null,
        fbclid: p.get('fbclid') || null
      };
    }

    const utms = getUtms();

    let state = {
      token: newToken(),
      step: 'inicio',
      path: null,
      i: 0,
      ans: {},
      resumed: false,
      resultado: null
    };

    function trackPixel(type, name, params, extra) {
      if (typeof window.fbq !== 'function') return;
      try {
        if (type === 'track') {
          window.fbq('track', name, params || {}, extra || undefined);
        } else {
          window.fbq('trackCustom', name, params || {});
        }
      } catch (_) {}
    }

    function saveLocal() {
      try {
        if (state.step === 'res') {
          localStorage.removeItem(STORAGE_KEY);
          return;
        }
        const payload = {
          token: state.token,
          path: state.path,
          step: state.step,
          i: state.i,
          ans: state.ans,
          updatedAt: Date.now()
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (_) {}
    }

    function clearLocal() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (_) {}
    }

    function postProgress(etapa, leadInfo) {
      try {
        fetch('/raiox/progresso', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          keepalive: true,
          body: JSON.stringify({
            token: state.token,
            path: state.path,
            etapa: etapa,
            answers: state.ans,
            lead_info: Object.assign({}, utms, leadInfo || {})
          })
        }).catch(() => {});
      } catch (_) {}
    }

    function restoreProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const saved = JSON.parse(raw);
          const fresh = saved && saved.updatedAt && (Date.now() - saved.updatedAt <= SEVEN_DAYS_MS);
          if (fresh && saved.path && PATHS[saved.path] && (saved.step === 'q' || saved.step === 'dados')) {
            state.token = saved.token || state.token;
            state.path = saved.path;
            state.step = saved.step;
            state.i = Number.isInteger(saved.i) ? saved.i : 0;
            state.ans = saved.ans || {};
            state.resumed = true;
            return;
          }
          if (!fresh) clearLocal();
        }
      } catch (_) {
        clearLocal();
      }

      if (RESUME_FROM_SERVER && RESUME_FROM_SERVER.token) {
        state.token = RESUME_FROM_SERVER.token;
      }
    }

    function updateChrome() {
      const pill = document.getElementById('stepPill');
      const fill = document.getElementById('progressFill');
      const banner = document.getElementById('resumeBanner');
      const stage = document.getElementById('stageContainer');

      banner.style.display = state.resumed && state.step !== 'res' ? 'flex' : 'none';
      stage.classList.toggle('wide', state.step === 'res' || state.step === 'dados');

      if (state.step === 'inicio') {
        pill.textContent = 'Pergunta 1 de 6';
        fill.style.width = '14%';
      } else if (state.step === 'q') {
        const num = state.i + 2;
        pill.textContent = `Pergunta ${num} de 6`;
        fill.style.width = `${Math.round((num / 6) * 84)}%`;
      } else if (state.step === 'dados') {
        pill.textContent = 'Último passo';
        fill.style.width = '94%';
      } else {
        pill.textContent = 'Diagnóstico pronto';
        fill.style.width = '100%';
      }
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function render() {
      updateChrome();
      const app = document.getElementById('app');

      if (state.step === 'inicio') {
        app.innerHTML = `
          <section class="card">
            <span class="meta-tag">6 perguntas · 1 minuto · resultado no WhatsApp</span>
            <h1>Hoje, onde está a maior dificuldade da sua empresa?</h1>
            <p class="sub">Selecione a opção que mais representa o momento atual do seu negócio.</p>
            <div class="path-grid">
              ${PATH_CARDS.map(c => `
                <button type="button" class="choice-btn" data-path="${c.key}" onclick="pickPath('${c.key}', this)">
                  <span class="choice-icon">${ICONS[c.key]}</span>
                  <span class="choice-text">
                    <span class="choice-title">${c.title}</span>
                    <span class="choice-desc">${c.desc}</span>
                  </span>
                </button>
              `).join('')}
            </div>
          </section>
        `;
        return;
      }

      if (state.step === 'q') {
        const ids = PATHS[state.path].ids;
        const qid = String(ids[state.i]);
        const q = Q[qid];
        const prevVal = state.ans[qid];

        app.innerHTML = `
          <section class="card">
            <span class="area-badge">${esc(q.area)} · ${state.i + 1} de ${ids.length}</span>
            <h2>${esc(q.pergunta)}</h2>
            <div class="choices">
              ${q.opcoes.map((opt, val) => `
                <button type="button" class="choice-btn ${prevVal === val ? 'selected' : ''}" onclick="pickAnswer('${qid}', ${val}, this)">
                  <span class="choice-letter">${LETTERS[val]}</span>
                  <span class="choice-text">${esc(opt)}</span>
                </button>
              `).join('')}
            </div>
            <div class="nav-row">
              <button type="button" class="btn-back" onclick="goBack()">${ICONS.arrowLeft} Voltar</button>
            </div>
          </section>
        `;
        return;
      }

      if (state.step === 'dados') {
        app.innerHTML = `
          <section class="card">
            <div class="dados-layout">
              <div class="summary-panel">
                <div class="summary-label">Diagnóstico calculado</div>
                <div class="blurred-score-row">
                  <span class="blurred-num">6,4</span>
                  <span class="blurred-den">/ 10</span>
                </div>
                <p>Suas respostas já foram processadas. Veja o que será liberado a seguir:</p>
                <ul class="summary-checks">
                  <li>${ICONS.check} Nota da sua área de 0 a 10</li>
                  <li>${ICONS.check} O ponto mais urgente para corrigir primeiro</li>
                  <li>${ICONS.check} Ação prática recomendada para esta semana</li>
                </ul>
              </div>

              <div>
                <h1>Pronto! Para onde enviamos seu resultado?</h1>
                <p class="sub">Você vê o diagnóstico completo na tela e recebe uma cópia no WhatsApp.</p>

                <form id="leadForm" onsubmit="submitLead(event)" novalidate>
                  <div id="formError" class="form-error"></div>

                  <div class="field">
                    <label for="fNome">Seu nome</label>
                    <input id="fNome" type="text" autocomplete="name" placeholder="Ex.: João Silva" required />
                  </div>

                  <div class="field">
                    <label for="fWhats">WhatsApp</label>
                    <input id="fWhats" type="tel" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000" oninput="maskTel(this)" required />
                  </div>

                  <div class="field">
                    <label for="fEmpresa">Nome da empresa <span class="opt-tag">(opcional)</span></label>
                    <input id="fEmpresa" type="text" autocomplete="organization" placeholder="Ex.: Clínica Vida" />
                  </div>

                  <button type="submit" class="btn-primary" id="submitBtn">Ver meu resultado ${ICONS.arrowRight}</button>
                  <p class="privacy-note">Seus dados estão seguros. Não enviamos spam.</p>
                </form>

                <div class="nav-row">
                  <button type="button" class="btn-back" onclick="goBack()">${ICONS.arrowLeft} Voltar</button>
                </div>
              </div>
            </div>
          </section>
        `;
        return;
      }

      if (state.step === 'res' && state.resultado) {
        const r = state.resultado;
        const notaNum = Number(r.nota || 0);
        const circ = 238.76;
        const offset = circ - (Math.max(0, Math.min(10, notaNum)) / 10) * circ;

        let statusClass = 'status-saudavel';
        let statusText = 'Saudável';
        let ringColor = '#15803D';
        if (notaNum < 4) {
          statusClass = 'status-critico';
          statusText = 'Crítico — ação imediata';
          ringColor = '#FA0102';
        } else if (notaNum < 7) {
          statusClass = 'status-construcao';
          statusText = 'Em construção';
          ringColor = '#D97706';
        }

        const isGeral = r.caminho === 'geral';

        app.innerHTML = `
          <section class="card">
            <div class="score-hero">
              <div class="score-left">
                <div class="ring-wrap">
                  <svg class="ring-svg" viewBox="0 0 92 92">
                    <circle class="ring-bg" cx="46" cy="46" r="38"></circle>
                    <circle class="ring-val" id="scoreRing" cx="46" cy="46" r="38" style="stroke:${ringColor};"></circle>
                  </svg>
                  <div class="ring-center">
                    <span class="ring-num">${esc(r.nota_formatada)}</span>
                    <span class="ring-den">de 10</span>
                  </div>
                </div>
                <div class="score-meta">
                  <span class="status-pill ${statusClass}">${statusText}</span>
                  <h3>${isGeral ? 'Diagnóstico Geral' : 'Área: ' + esc(r.area_nome)}</h3>
                  <p class="sub" style="margin:0;">Resultado calculado com base nas 5 respostas deste caminho.</p>
                </div>
              </div>
            </div>

            <div class="result-grid">
              <div>
                ${isGeral ? `
                  <div class="geral-highlight">
                    <strong>Área com menor nota: ${esc(r.gargalo_nome)}</strong> — esta é a área prioritária sugerida para a sua devolutiva.
                  </div>
                ` : ''}

                <div class="urgent-card">
                  <div class="urgent-tag">Ponto mais urgente · ${esc(r.urgente_area)}</div>
                  <p class="urgent-title">${esc(r.urgente_pergunta)}</p>
                  <p class="urgent-action"><strong>Ação recomendada:</strong> ${esc(r.acao_prioritaria)}</p>
                </div>
              </div>

              <div class="answers-box">
                <p class="answers-title">Resumo das respostas</p>
                ${(r.detalhes || []).map(d => {
                  let bClass = 'status-saudavel';
                  let bTxt = 'Forte';
                  if (d.valor === 0) { bClass = 'status-critico'; bTxt = 'Crítico'; }
                  else if (d.valor === 1) { bClass = 'status-construcao'; bTxt = 'Inicial'; }
                  else if (d.valor === 2) { bClass = 'status-construcao'; bTxt = 'Bom'; }
                  return `
                    <div class="ans-row">
                      <span class="ans-name">${esc(d.curto)}</span>
                      <span class="ans-badge ${bClass}">${bTxt} (${d.valor}/3)</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <div class="result-actions">
              <a class="btn-primary btn-wa" href="${esc(r.whatsapp_url)}" target="_blank" rel="noopener">
                Falar no WhatsApp sobre meu diagnóstico ${ICONS.arrowRight}
              </a>
              ${r.pdf_url ? `<a class="btn-ghost" style="text-align:center;text-decoration:none;" href="${esc(r.pdf_url)}" target="_blank" rel="noopener">Baixar meu diagnóstico em PDF</a>` : ''}
              <button type="button" class="btn-ghost" onclick="resetFlow()">Refazer diagnóstico</button>
            </div>
          </section>
        `;

        requestAnimationFrame(() => {
          const ring = document.getElementById('scoreRing');
          if (ring) ring.style.strokeDashoffset = String(offset);
        });
      }
    }

    function pickPath(pathKey, btn) {
      if (btn) btn.classList.add('selected');
      state.path = pathKey;
      state.step = 'q';
      state.i = 0;
      state.ans = {};
      state.resumed = false;
      saveLocal();
      trackPixel('trackCustom', 'RaioXInicio', { caminho: pathKey });
      postProgress('inicio');
      setTimeout(render, 180);
    }

    function pickAnswer(qid, val, btn) {
      if (btn) btn.classList.add('selected');
      state.ans[qid] = val;
      const num = state.i + 1;
      postProgress('p' + num);

      setTimeout(() => {
        const ids = PATHS[state.path].ids;
        if (state.i + 1 < ids.length) {
          state.i += 1;
          saveLocal();
          render();
        } else {
          state.step = 'dados';
          saveLocal();
          trackPixel('trackCustom', 'RaioXPerguntas', { caminho: state.path });
          postProgress('dados');
          render();
        }
      }, 200);
    }

    function goBack() {
      if (state.step === 'dados') {
        state.step = 'q';
        state.i = PATHS[state.path].ids.length - 1;
      } else if (state.step === 'q') {
        if (state.i > 0) {
          state.i -= 1;
        } else {
          state.step = 'inicio';
          state.path = null;
        }
      }
      saveLocal();
      render();
    }

    function resetFlow() {
      clearLocal();
      state = {
        token: newToken(),
        step: 'inicio',
        path: null,
        i: 0,
        ans: {},
        resumed: false,
        resultado: null
      };
      postProgress('abriu');
      render();
    }

    function maskTel(input) {
      let d = input.value.replace(/\D/g, '').slice(0, 11);
      if (d.length > 10) {
        d = d.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
      } else if (d.length > 6) {
        d = d.replace(/^(\d{2})(\d{4})(\d{0,4})$/, '($1) $2-$3');
      } else if (d.length > 2) {
        d = d.replace(/^(\d{2})(\d{0,5})$/, '($1) $2');
      }
      input.value = d;
    }

    async function submitLead(e) {
      e.preventDefault();
      const errEl = document.getElementById('formError');
      const btn = document.getElementById('submitBtn');
      const nome = (document.getElementById('fNome').value || '').trim();
      const whatsRaw = (document.getElementById('fWhats').value || '').trim();
      const whatsDigits = whatsRaw.replace(/\D/g, '');
      const empresa = (document.getElementById('fEmpresa').value || '').trim();

      errEl.style.display = 'none';

      if (!nome) {
        errEl.textContent = 'Por favor, informe seu nome.';
        errEl.style.display = 'block';
        return;
      }
      if (whatsDigits.length < 10) {
        errEl.textContent = 'Por favor, informe um WhatsApp válido com DDD.';
        errEl.style.display = 'block';
        return;
      }

      const eventId = 'lead_' + state.token.replace(/[^a-zA-Z0-9]/g, '').slice(0, 16);
      btn.disabled = true;
      btn.textContent = 'Calculando resultado...';

      try {
        const res = await fetch('/raiox/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            version: 'v3',
            token: state.token,
            path: state.path,
            event_id: eventId,
            answers: state.ans,
            lead_info: Object.assign({}, utms, {
              nome: nome,
              whatsapp: whatsRaw,
              empresa: empresa
            })
          })
        });
        const data = await res.json();
        if (!res.ok || data.status !== 'success') {
          throw new Error(data.message || 'Erro ao enviar diagnóstico.');
        }

        trackPixel('track', 'Lead', {}, { eventID: data.resultado.event_id || eventId });
        clearLocal();
        state.resultado = data.resultado;
        state.step = 'res';
        state.resumed = false;
        render();
      } catch (err) {
        errEl.textContent = err.message || 'Não foi possível concluir. Tente novamente.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = `Ver meu resultado ${ICONS.arrowRight}`;
      }
    }

    restoreProgress();
    if (!state.resumed) {
      postProgress('abriu');
    }
    render();
  </script>
</body>
</html>
