<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Raio-X NorthWay | Diagnóstico Comercial em 1 Minuto</title>
  <meta name="description" content="Descubra em 1 minuto onde está o maior gargalo da sua empresa e receba o plano de ação no WhatsApp." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --red: #FA0102;
      --red-dark: #D60001;
      --red-soft: #FFF1F2;
      --red-border: #FECDD3;
      --ink: #0F172A;
      --ink-2: #334155;
      --muted: #64748B;
      --line: #E2E8F0;
      --bg: #F6F7FB;
      --card: #FFFFFF;
      --ok: #10B981;
      --ok-soft: #ECFDF5;
      --warn: #F59E0B;
      --warn-soft: #FFFBEB;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.08);
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 85% 0%, rgba(250, 1, 2, 0.06) 0%, transparent 42%),
        radial-gradient(circle at 10% 100%, rgba(15, 23, 42, 0.04) 0%, transparent 45%),
        var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 580px;
      margin: 0 auto;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    }

    /* Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 2px 14px;
      gap: 12px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .brand-mark {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(250, 1, 2, 0.14);
      flex-shrink: 0;
    }

    .step-pill {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-2);
      background: #FFFFFF;
      border: 1px solid var(--line);
      padding: 5px 11px;
      border-radius: 999px;
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
    }

    /* Progress bar */
    .progress-track {
      height: 5px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--red), #FF4D4E);
      border-radius: 999px;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Resume banner */
    .resume-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      color: #92400E;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      animation: fadeUp 0.28s ease both;
    }

    .resume-banner button {
      background: transparent;
      border: none;
      color: #B45309;
      font-weight: 700;
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
    }

    /* Main Card */
    .card {
      background: var(--card);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      box-shadow: var(--shadow-md);
      animation: fadeUp 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @media (min-width: 480px) {
      .card {
        padding: 30px 28px;
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--red);
      background: var(--red-soft);
      border: 1px solid var(--red-border);
      padding: 5px 11px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .area-badge {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: #F1F5F9;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(22px, 5.2vw, 27px);
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin: 0 0 8px;
      color: var(--ink);
    }

    h2 {
      font-size: clamp(19px, 4.5vw, 22px);
      line-height: 1.28;
      font-weight: 700;
      letter-spacing: -0.015em;
      margin: 0 0 18px;
      color: var(--ink);
    }

    .sub {
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted);
      margin: 0 0 20px;
    }

    /* Choice buttons */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      background: #FFFFFF;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-md);
      padding: 15px 16px;
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 13px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.38;
      color: var(--ink);
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
      position: relative;
    }

    .choice-btn:hover {
      border-color: #CBD5E1;
      background: #F8FAFC;
    }

    .choice-btn:active {
      transform: scale(0.985);
    }

    .choice-btn.selected {
      border-color: var(--red);
      background: var(--red-soft);
      box-shadow: 0 0 0 3px rgba(250, 1, 2, 0.12);
    }

    .choice-emoji {
      font-size: 22px;
      line-height: 1;
      flex-shrink: 0;
    }

    .choice-text {
      flex: 1;
      min-width: 0;
    }

    .choice-title {
      display: block;
      font-weight: 700;
      color: var(--ink);
      font-size: 15.5px;
    }

    .choice-desc {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-top: 2px;
    }

    .choice-letter {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #F1F5F9;
      color: var(--ink-2);
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.16s ease, color 0.16s ease;
    }

    .choice-btn.selected .choice-letter {
      background: var(--red);
      color: #FFFFFF;
    }

    /* Back button */
    .nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
    }

    .btn-back {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-back:hover {
      color: var(--ink);
    }

    /* Data Capture Teaser */
    .teaser-box {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      color: #FFFFFF;
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
      overflow: hidden;
      position: relative;
    }

    .teaser-box::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.07), transparent);
      transform: translateX(-100%);
      animation: shimmer 2.6s infinite;
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }

    .teaser-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94A3B8;
      margin-bottom: 4px;
    }

    .teaser-title {
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
    }

    .teaser-blur {
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
      filter: blur(7px);
      user-select: none;
      flex-shrink: 0;
    }

    /* Form fields */
    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-2);
      margin-bottom: 6px;
    }

    .opt-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }

    .field input {
      width: 100%;
      padding: 14px 15px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      font-family: inherit;
      font-size: 16px; /* Prevents iOS Safari zoom */
      font-weight: 500;
      color: var(--ink);
      background: #FFFFFF;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .field input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(250, 1, 2, 0.1);
    }

    .form-error {
      background: var(--red-soft);
      border: 1px solid var(--red-border);
      color: #9F1239;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      display: none;
    }

    .btn-primary {
      width: 100%;
      background: var(--red);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      padding: 16px 20px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(250, 1, 2, 0.25);
      transition: background-color 0.16s ease, transform 0.14s ease;
      text-decoration: none;
      margin-top: 6px;
    }

    .btn-primary:hover {
      background: var(--red-dark);
    }

    .btn-primary:active {
      transform: scale(0.985);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .privacy-note {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin: 12px 0 0;
      line-height: 1.4;
    }

    /* Result Screen */
    .score-hero {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .ring-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      flex-shrink: 0;
    }

    .ring-svg {
      width: 96px;
      height: 96px;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: #E2E8F0;
      stroke-width: 8;
    }

    .ring-val {
      fill: none;
      stroke: var(--red);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 251.2;
      stroke-dashoffset: 251.2;
      transition: stroke-dashoffset 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .ring-num {
      font-size: 25px;
      font-weight: 800;
      color: var(--ink);
    }

    .ring-den {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 2px;
    }

    .score-meta h3 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
    }

    .status-pill {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .status-critico { background: var(--red-soft); color: #BE123C; }
    .status-construcao { background: var(--warn-soft); color: #B45309; }
    .status-saudavel { background: var(--ok-soft); color: #047857; }

    .geral-highlight {
      background: #FFF7ED;
      border: 1px solid #FED7AA;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.45;
      color: #9A3412;
    }

    .urgent-card {
      background: #FEF2F2;
      border: 1.5px solid #FECACA;
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .urgent-tag {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--red);
      margin-bottom: 6px;
    }

    .urgent-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
      margin: 0 0 8px;
      line-height: 1.35;
    }

    .urgent-action {
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink-2);
      margin: 0;
    }

    .answers-list {
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-bottom: 18px;
    }

    .answers-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 10px;
    }

    .ans-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px dashed #E2E8F0;
      font-size: 13.5px;
    }

    .ans-row:last-child {
      border-bottom: none;
    }

    .ans-name {
      font-weight: 600;
      color: var(--ink-2);
    }

    .ans-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-wa {
      background: #16A34A;
      box-shadow: 0 8px 20px rgba(22, 163, 74, 0.24);
    }

    .btn-wa:hover {
      background: #15803D;
    }

    .btn-ghost {
      width: 100%;
      background: transparent;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-2);
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-ghost:hover {
      background: #F8FAFC;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: auto;
      padding-top: 18px;
    }

    .footer a {
      color: var(--muted);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>Raio-X NorthWay</span>
      </div>
      <span class="step-pill" id="stepPill">Pergunta 1 de 6</span>
    </header>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="resume-banner" id="resumeBanner" style="display: none;">
      <span>Continuando de onde você parou</span>
      <button type="button" onclick="resetFlow()">Recomeçar</button>
    </div>

    <main id="app"></main>

    <footer class="footer">
      NorthWay Company · <a href="/privacidade" target="_blank" rel="noopener">Política de Privacidade</a>
    </footer>
  </div>

  <script>
    const Q = {{ v3_questions | tojson }};
    const PATHS = {{ v3_paths | tojson }};
    const RESUME_FROM_SERVER = {{ resume_data | tojson }};
    const DEFAULT_ORIGEM = {{ origem | tojson }};
    const STORAGE_KEY = 'nw_raiox_v3_progress';
    const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

    const PATH_CARDS = [
      { key: 'marketing', emoji: '📣', title: 'Atrair clientes', desc: 'Pouca gente chega até mim' },
      { key: 'comercial', emoji: '🤝', title: 'Vender', desc: 'As pessoas chegam, mas não fecham' },
      { key: 'gestao', emoji: '📊', title: 'Organizar a empresa', desc: 'Números, metas e lucro' },
      { key: 'geral', emoji: '🤔', title: 'Não sei dizer', desc: 'Quero descobrir onde está o gargalo' }
    ];

    const LETTERS = ['A', 'B', 'C', 'D'];

    function newToken() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'rx_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    }

    function getUtms() {
      const p = new URLSearchParams(window.location.search);
      return {
        origem: p.get('origem') || p.get('utm_source') || DEFAULT_ORIGEM || 'direto',
        utm_source: p.get('utm_source') || null,
        utm_medium: p.get('utm_medium') || null,
        utm_campaign: p.get('utm_campaign') || null,
        utm_content: p.get('utm_content') || null,
        utm_term: p.get('utm_term') || null,
        fbclid: p.get('fbclid') || null
      };
    }

    const utms = getUtms();

    let state = {
      token: newToken(),
      step: 'inicio', // inicio | q | dados | res
      path: null,
      i: 0,
      ans: {},
      resumed: false,
      resultado: null
    };

    function trackPixel(type, name, params, extra) {
      if (typeof window.fbq !== 'function') return;
      try {
        if (type === 'track') {
          window.fbq('track', name, params || {}, extra || undefined);
        } else {
          window.fbq('trackCustom', name, params || {});
        }
      } catch (_) {}
    }

    function saveLocal() {
      try {
        if (state.step === 'res') {
          localStorage.removeItem(STORAGE_KEY);
          return;
        }
        const payload = {
          token: state.token,
          path: state.path,
          step: state.step,
          i: state.i,
          ans: state.ans,
          updatedAt: Date.now()
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (_) {}
    }

    function clearLocal() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (_) {}
    }

    function postProgress(etapa, leadInfo) {
      try {
        fetch('/raiox/progresso', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          keepalive: true,
          body: JSON.stringify({
            token: state.token,
            path: state.path,
            etapa: etapa,
            answers: state.ans,
            lead_info: Object.assign({}, utms, leadInfo || {})
          })
        }).catch(() => {});
      } catch (_) {}
    }

    function restoreProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const saved = JSON.parse(raw);
          const fresh = saved && saved.updatedAt && (Date.now() - saved.updatedAt <= SEVEN_DAYS_MS);
          if (fresh && saved.path && PATHS[saved.path] && (saved.step === 'q' || saved.step === 'dados')) {
            state.token = saved.token || state.token;
            state.path = saved.path;
            state.step = saved.step;
            state.i = Number.isInteger(saved.i) ? saved.i : 0;
            state.ans = saved.ans || {};
            state.resumed = true;
            return;
          }
          if (!fresh) clearLocal();
        }
      } catch (_) {
        clearLocal();
      }

      if (RESUME_FROM_SERVER && RESUME_FROM_SERVER.token) {
        state.token = RESUME_FROM_SERVER.token;
      }
    }

    function updateChrome() {
      const pill = document.getElementById('stepPill');
      const fill = document.getElementById('progressFill');
      const banner = document.getElementById('resumeBanner');

      banner.style.display = state.resumed && state.step !== 'res' ? 'flex' : 'none';

      if (state.step === 'inicio') {
        pill.textContent = 'Pergunta 1 de 6';
        fill.style.width = '14%';
      } else if (state.step === 'q') {
        const num = state.i + 2;
        pill.textContent = `Pergunta ${num} de 6`;
        fill.style.width = `${Math.round((num / 6) * 84)}%`;
      } else if (state.step === 'dados') {
        pill.textContent = 'Último passo';
        fill.style.width = '94%';
      } else {
        pill.textContent = 'Diagnóstico pronto';
        fill.style.width = '100%';
      }
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function render() {
      updateChrome();
      const app = document.getElementById('app');

      if (state.step === 'inicio') {
        app.innerHTML = `
          <section class="card">
            <span class="eyebrow">6 perguntas · 1 minuto · resultado no WhatsApp</span>
            <h1>Hoje, onde está a maior dificuldade da sua empresa?</h1>
            <p class="sub">Toque na opção que mais representa o seu momento agora.</p>
            <div class="choices">
              ${PATH_CARDS.map(c => `
                <button type="button" class="choice-btn" data-path="${c.key}" onclick="pickPath('${c.key}', this)">
                  <span class="choice-emoji">${c.emoji}</span>
                  <span class="choice-text">
                    <span class="choice-title">${c.title}</span>
                    <span class="choice-desc">${c.desc}</span>
                  </span>
                </button>
              `).join('')}
            </div>
          </section>
        `;
        return;
      }

      if (state.step === 'q') {
        const ids = PATHS[state.path].ids;
        const qid = String(ids[state.i]);
        const q = Q[qid];
        const prevVal = state.ans[qid];

        app.innerHTML = `
          <section class="card">
            <span class="area-badge">${esc(q.area)} · ${state.i + 1} de ${ids.length}</span>
            <h2>${esc(q.pergunta)}</h2>
            <div class="choices">
              ${q.opcoes.map((opt, val) => `
                <button type="button" class="choice-btn ${prevVal === val ? 'selected' : ''}" onclick="pickAnswer('${qid}', ${val}, this)">
                  <span class="choice-letter">${LETTERS[val]}</span>
                  <span class="choice-text">${esc(opt)}</span>
                </button>
              `).join('')}
            </div>
            <div class="nav-row">
              <button type="button" class="btn-back" onclick="goBack()">← Voltar</button>
            </div>
          </section>
        `;
        return;
      }

      if (state.step === 'dados') {
        app.innerHTML = `
          <section class="card">
            <div class="teaser-box">
              <div>
                <div class="teaser-label">Nota calculada</div>
                <div class="teaser-title">Seu diagnóstico + plano de ação estão prontos</div>
              </div>
              <div class="teaser-blur">6,4</div>
            </div>

            <h1>Pronto! Para onde enviamos seu resultado?</h1>
            <p class="sub">Você vê a nota e o ponto mais urgente aqui na tela e recebe também no WhatsApp.</p>

            <form id="leadForm" onsubmit="submitLead(event)" novalidate>
              <div id="formError" class="form-error"></div>

              <div class="field">
                <label for="fNome">Seu nome</label>
                <input id="fNome" type="text" autocomplete="name" placeholder="Ex.: João Silva" required />
              </div>

              <div class="field">
                <label for="fWhats">WhatsApp</label>
                <input id="fWhats" type="tel" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000" oninput="maskTel(this)" required />
              </div>

              <div class="field">
                <label for="fEmpresa">Nome da empresa <span class="opt-tag">(opcional)</span></label>
                <input id="fEmpresa" type="text" autocomplete="organization" placeholder="Ex.: Clínica Vida" />
              </div>

              <button type="submit" class="btn-primary" id="submitBtn">Ver meu resultado →</button>
              <p class="privacy-note">Seus dados estão seguros. Não enviamos spam.</p>
            </form>

            <div class="nav-row">
              <button type="button" class="btn-back" onclick="goBack()">← Voltar</button>
            </div>
          </section>
        `;
        return;
      }

      if (state.step === 'res' && state.resultado) {
        const r = state.resultado;
        const notaNum = Number(r.nota || 0);
        const circ = 251.2;
        const offset = circ - (Math.max(0, Math.min(10, notaNum)) / 10) * circ;

        let statusClass = 'status-saudavel';
        let statusText = 'Saudável';
        let ringColor = '#10B981';
        if (notaNum < 4) {
          statusClass = 'status-critico';
          statusText = 'Crítico — ação imediata';
          ringColor = '#FA0102';
        } else if (notaNum < 7) {
          statusClass = 'status-construcao';
          statusText = 'Em construção';
          ringColor = '#F59E0B';
        }

        const isGeral = r.caminho === 'geral';

        app.innerHTML = `
          <section class="card">
            <div class="score-hero">
              <div class="ring-wrap">
                <svg class="ring-svg" viewBox="0 0 96 96">
                  <circle class="ring-bg" cx="48" cy="48" r="40"></circle>
                  <circle class="ring-val" id="scoreRing" cx="48" cy="48" r="40" style="stroke:${ringColor};"></circle>
                </svg>
                <div class="ring-center">
                  <span class="ring-num">${esc(r.nota_formatada)}</span>
                  <span class="ring-den">de 10</span>
                </div>
              </div>
              <div class="score-meta">
                <span class="status-pill ${statusClass}">${statusText}</span>
                <h3>${isGeral ? 'Diagnóstico Geral' : 'Área: ' + esc(r.area_nome)}</h3>
                <p class="sub" style="margin:0;">Baseado nas suas 5 respostas deste caminho.</p>
              </div>
            </div>

            ${isGeral ? `
              <div class="geral-highlight">
                <strong>Área com menor nota: ${esc(r.gargalo_nome)}</strong> — essa é a área prioritária sugerida para a sua devolutiva gratuita.
              </div>
            ` : ''}

            <div class="urgent-card">
              <div class="urgent-tag">Ponto mais urgente · ${esc(r.urgente_area)}</div>
              <p class="urgent-title">${esc(r.urgente_pergunta)}</p>
              <p class="urgent-action"><strong>Ação recomendada:</strong> ${esc(r.acao_prioritaria)}</p>
            </div>

            <div class="answers-list">
              <p class="answers-title">Resumo das suas respostas</p>
              ${(r.detalhes || []).map(d => {
                let bClass = 'status-saudavel';
                let bTxt = 'Forte';
                if (d.valor === 0) { bClass = 'status-critico'; bTxt = 'Crítico'; }
                else if (d.valor === 1) { bClass = 'status-construcao'; bTxt = 'Inicial'; }
                else if (d.valor === 2) { bClass = 'status-construcao'; bTxt = 'Bom'; }
                return `
                  <div class="ans-row">
                    <span class="ans-name">${esc(d.curto)}</span>
                    <span class="ans-badge ${bClass}">${bTxt} (${d.valor}/3)</span>
                  </div>
                `;
              }).join('')}
            </div>

            <a class="btn-primary btn-wa" href="${esc(r.whatsapp_url)}" target="_blank" rel="noopener">
              Falar no WhatsApp sobre meu diagnóstico →
            </a>
            <button type="button" class="btn-ghost" onclick="resetFlow()">Refazer diagnóstico</button>
          </section>
        `;

        requestAnimationFrame(() => {
          const ring = document.getElementById('scoreRing');
          if (ring) ring.style.strokeDashoffset = String(offset);
        });
      }
    }

    function pickPath(pathKey, btn) {
      if (btn) btn.classList.add('selected');
      state.path = pathKey;
      state.step = 'q';
      state.i = 0;
      state.ans = {};
      state.resumed = false;
      saveLocal();
      trackPixel('trackCustom', 'RaioXInicio', { caminho: pathKey });
      postProgress('inicio');
      setTimeout(render, 220);
    }

    function pickAnswer(qid, val, btn) {
      if (btn) btn.classList.add('selected');
      state.ans[qid] = val;
      const num = state.i + 1;
      postProgress('p' + num);

      setTimeout(() => {
        const ids = PATHS[state.path].ids;
        if (state.i + 1 < ids.length) {
          state.i += 1;
          saveLocal();
          render();
        } else {
          state.step = 'dados';
          saveLocal();
          trackPixel('trackCustom', 'RaioXPerguntas', { caminho: state.path });
          postProgress('dados');
          render();
        }
      }, 240);
    }

    function goBack() {
      if (state.step === 'dados') {
        state.step = 'q';
        state.i = PATHS[state.path].ids.length - 1;
      } else if (state.step === 'q') {
        if (state.i > 0) {
          state.i -= 1;
        } else {
          state.step = 'inicio';
          state.path = null;
        }
      }
      saveLocal();
      render();
    }

    function resetFlow() {
      clearLocal();
      state = {
        token: newToken(),
        step: 'inicio',
        path: null,
        i: 0,
        ans: {},
        resumed: false,
        resultado: null
      };
      postProgress('abriu');
      render();
    }

    function maskTel(input) {
      let d = input.value.replace(/\D/g, '').slice(0, 11);
      if (d.length > 10) {
        d = d.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
      } else if (d.length > 6) {
        d = d.replace(/^(\d{2})(\d{4})(\d{0,4})$/, '($1) $2-$3');
      } else if (d.length > 2) {
        d = d.replace(/^(\d{2})(\d{0,5})$/, '($1) $2');
      }
      input.value = d;
    }

    async function submitLead(e) {
      e.preventDefault();
      const errEl = document.getElementById('formError');
      const btn = document.getElementById('submitBtn');
      const nome = (document.getElementById('fNome').value || '').trim();
      const whatsRaw = (document.getElementById('fWhats').value || '').trim();
      const whatsDigits = whatsRaw.replace(/\D/g, '');
      const empresa = (document.getElementById('fEmpresa').value || '').trim();

      errEl.style.display = 'none';

      if (!nome) {
        errEl.textContent = 'Por favor, informe seu nome.';
        errEl.style.display = 'block';
        return;
      }
      if (whatsDigits.length < 10) {
        errEl.textContent = 'Por favor, informe um WhatsApp válido com DDD.';
        errEl.style.display = 'block';
        return;
      }

      const eventId = 'lead_' + state.token.replace(/[^a-zA-Z0-9]/g, '').slice(0, 16);
      btn.disabled = true;
      btn.textContent = 'Calculando resultado...';

      try {
        const res = await fetch('/raiox/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            version: 'v3',
            token: state.token,
            path: state.path,
            event_id: eventId,
            answers: state.ans,
            lead_info: Object.assign({}, utms, {
              nome: nome,
              whatsapp: whatsRaw,
              empresa: empresa
            })
          })
        });
        const data = await res.json();
        if (!res.ok || data.status !== 'success') {
          throw new Error(data.message || 'Erro ao enviar diagnóstico.');
        }

        trackPixel('track', 'Lead', {}, { eventID: data.resultado.event_id || eventId });
        clearLocal();
        state.resultado = data.resultado;
        state.step = 'res';
        state.resumed = false;
        render();
      } catch (err) {
        errEl.textContent = err.message || 'Não foi possível concluir. Tente novamente.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Ver meu resultado →';
      }
    }

    restoreProgress();
    if (!state.resumed) {
      postProgress('abriu');
    }
    render();
  </script>
</body>
</html>
