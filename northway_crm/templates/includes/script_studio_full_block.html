<div id="content-client-script-studio" class="hidden min-h-screen bg-[#FAFAF8] font-dm" x-data="scriptStudio()">
    <!-- Top Navigation Bar -->
    <div
        class="bg-white/80 backdrop-blur-md border-b border-gray-100 px-6 py-4 flex items-center justify-between sticky top-0 z-30 shadow-sm gap-4">
        <div class="flex items-center gap-6 flex-shrink-0">
            <!-- Logo -->
            <div class="flex items-center gap-3 group cursor-default">
                <div
                    class="w-12 h-12 bg-gradient-to-br from-[#fa0102] to-[#b90102] rounded-xl flex items-center justify-center text-white font-serif text-3xl font-bold italic shadow-lg shadow-red-500/20 transform group-hover:scale-105 transition-transform">
                    N</div>
                <div class="flex flex-col leading-none">
                    <span class="text-[10px] font-black tracking-[0.3em] text-gray-400 uppercase">NorthWay</span>
                    <span class="text-xl font-serif font-black italic text-gray-900 tracking-tight">SCRIPT
                        STUDIO</span>
                </div>
            </div>

            <!-- Client Name (Static) -->
            <div class="h-10 w-px bg-gray-100 mx-2"></div>
            <div class="flex flex-col leading-none">
                <span
                    class="text-[8px] font-black uppercase tracking-widest text-gray-400 mb-1.5 flex items-center gap-1">
                    <span class="w-1 h-1 bg-green-500 rounded-full animate-pulse"></span>
                    Cliente Ativo
                </span>
                <span class="text-sm font-black text-gray-900">{{ client.name }}</span>
            </div>
        </div>

        <!-- Tabs & Explorer Toggle -->
        <div class="flex-1 flex items-center gap-4 px-4 min-w-0">
            <button type="button" @click="showExplorer = !showExplorer"
                class="flex items-center gap-2 px-4 py-2 rounded-xl border border-gray-100 bg-white text-gray-600 hover:text-black hover:bg-gray-50 transition-all font-black text-[10px] uppercase tracking-widest shrink-0 shadow-sm"
                :class="showExplorer ? 'border-red-100 bg-red-50/30 text-[#fa0102]' : ''">
                <i :data-lucide="showExplorer ? 'layout-list' : 'list'" class="w-4 h-4"></i>
                <span x-text="showExplorer ? 'Fechar Lista' : 'Meus Roteiros'"></span>
                <span class="bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded text-[8px]"
                    x-text="openScripts.length"></span>
            </button>

            <div class="h-6 w-px bg-gray-100"></div>

            <!-- Horizontal Tabs (Minimal) -->
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
                <template x-for="(script, index) in openScripts" :key="script.id">
                    <button type="button" @click="activeScriptId = script.id"
                        class="flex items-center gap-2 px-3 py-1.5 rounded-lg transition-all border shrink-0 group relative"
                        :class="activeScriptId === script.id ? 'bg-black border-transparent text-white font-bold' : 'bg-white border-gray-50 text-gray-400 hover:text-gray-600 font-medium'">
                        <span x-text="script.name || 'Sem nome'" class="truncate max-w-[80px] text-[10px]"></span>
                        <span @click.stop="closeScript(index)"
                            class="hover:bg-white/20 p-0.5 rounded transition-all opacity-0 group-hover:opacity-100">
                            <i data-lucide="x" class="w-2.5 h-2.5"></i>
                        </span>
                    </button>
                </template>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-3 flex-shrink-0">
            <button type="button" @click="showTemplates = true"
                class="px-5 py-2.5 text-xs font-black uppercase tracking-widest text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-xl transition-all flex items-center gap-2">
                <i data-lucide="layout" class="w-4 h-4"></i>
                Templates
            </button>
            <button type="button" @click="createNewScript"
                class="px-6 py-2.5 bg-black text-white rounded-xl text-xs font-black uppercase tracking-widest hover:bg-gray-800 transition-all flex items-center gap-2 shadow-lg shadow-black/10 hover:-translate-y-0.5 transform active:translate-y-0">
                <i data-lucide="plus" class="w-4 h-4"></i>
                Novo Script
            </button>
            <div class="relative group">
                <button type="button" disabled
                    class="px-5 py-2.5 bg-gray-50 border border-gray-100 rounded-xl text-xs font-black uppercase tracking-widest text-gray-300 flex items-center gap-2 cursor-not-allowed">
                    ✨ IA
                    <span
                        class="text-[8px] bg-gray-200 text-gray-400 px-1.5 py-0.5 rounded uppercase tracking-tighter">Em
                        breve</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Script Explorer (Sidebar List View) -->
    <div x-show="showExplorer" id="script-explorer" x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 -translate-x-4" x-transition:enter-end="opacity-100 translate-x-0"
        class="fixed left-0 top-0 bottom-0 w-80 bg-white border-r border-gray-100 shadow-2xl flex flex-col transition-all duration-300" style="z-index: 9999;">
        <div class="p-6 border-b border-gray-50 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="font-black text-gray-900 uppercase tracking-widest text-xs">Meus Roteiros
                    </h3>
                    <p class="text-[9px] text-gray-400 font-bold uppercase tracking-tighter mt-1">
                        Organização & Datas</p>
                </div>
                <button type="button" @click="showExplorer = false"
                    class="p-2 hover:bg-gray-50 rounded-xl transition-all">
                    <i data-lucide="chevron-left" class="w-4 h-4 text-gray-400"></i>
                </button>
            </div>
            <!-- Selection Mode Toggle -->
            <div class="flex items-center justify-between bg-gray-50 p-2 rounded-xl border border-gray-100">
                <span class="text-[8px] font-black uppercase text-gray-500 tracking-widest pl-2">Modo
                    Seleção</span>
                <button type="button" @click="toggleSelectionMode()"
                    class="w-8 h-4 rounded-full transition-all relative"
                    :class="selectionMode ? 'bg-[#fa0102]' : 'bg-gray-200'">
                    <div class="absolute top-0.5 w-3 h-3 bg-white rounded-full transition-all"
                        :class="selectionMode ? 'left-4.5' : 'left-0.5'"></div>
                </button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-2 no-scrollbar">
            <template x-for="(script, index) in openScripts" :key="script.id">
                <div @click="activeScriptId = script.id; showExplorer = false"
                    class="group p-4 rounded-2xl border transition-all cursor-pointer relative overflow-hidden"
                    :class="activeScriptId === script.id ? 'bg-red-50 border-red-100' : 'bg-white border-gray-50 hover:border-gray-200 hover:shadow-lg hover:shadow-gray-100/50'">

                    <div x-show="activeScriptId === script.id" class="absolute left-0 top-0 bottom-0 w-1 bg-[#fa0102]">
                    </div>

                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-3 flex-1 min-w-0">
                            <!-- Checkbox (Visible only in selection mode) -->
                            <div x-show="selectionMode" @click.stop="toggleScriptSelection(script.id)"
                                class="w-5 h-5 rounded border-2 border-gray-200 flex items-center justify-center shrink-0 transition-all"
                                :class="selectedScriptIds.includes(script.id) ? 'bg-[#fa0102] border-[#fa0102]' : 'bg-white hover:border-red-200'">
                                <i data-lucide="check" class="w-3.5 h-3.5 text-white"
                                    x-show="selectedScriptIds.includes(script.id)"></i>
                            </div>

                            <div class="min-w-0">
                                <h4 class="font-black text-gray-900 text-sm truncate"
                                    x-text="script.name || 'Sem nome'"></h4>
                                <div class="flex items-center gap-2 mt-2">
                                    <span class="text-[9px] font-black uppercase tracking-widest text-gray-400"
                                        x-text="script.channel"></span>
                                    <span class="w-1 h-1 bg-gray-200 rounded-full"></span>
                                    <span class="text-[9px] font-black uppercase tracking-widest text-[#fa0102]/60"
                                        x-text="script.created_at || '--/--/----'"></span>
                                </div>
                            </div>
                        </div>
                        <i :data-lucide="script.type === 'Criativo' ? 'zap' : 'video'"
                            class="w-4 h-4 text-gray-200 group-hover:text-[#fa0102] transition-all"></i>
                    </div>

                    <div
                        class="mt-4 flex items-center justify-between opacity-0 group-hover:opacity-100 transition-all">
                        <div class="flex items-center gap-2">
                            <span class="text-[8px] font-black uppercase tracking-widest text-gray-400"
                                x-text="script.duration || '...' "></span>
                        </div>
                        <button type="button" @click.stop="closeScript(index)"
                            class="text-[8px] font-black uppercase tracking-widest text-red-400 hover:text-red-600 transition-all">
                            Excluir
                        </button>
                    </div>
                </div>
            </template>
        </div>

        <div class="p-4 bg-gray-50 border-t border-gray-100">
            <!-- Normal Mode -->
            <button type="button" x-show="!selectionMode" @click="downloadAllScripts"
                class="w-full py-4 bg-black text-white rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-gray-800 transition-all flex items-center justify-center gap-3 shadow-xl shadow-black/10">
                <i data-lucide="file-down" class="w-4 h-4"></i>
                Baixar Tudo em PDF
            </button>

            <!-- Selection Mode Actions -->
            <div x-show="selectionMode" class="flex flex-col gap-2">
                <div class="flex items-center justify-between px-2 mb-1">
                    <span class="text-[9px] font-black uppercase text-gray-400"
                        x-text="`${selectedScriptIds.length} selecionados`"></span>
                    <button type="button" @click="selectedScriptIds = []"
                        class="text-[9px] font-black uppercase text-red-500 hover:underline">Limpar</button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" @click="downloadSelected()" :disabled="selectedScriptIds.length === 0"
                        class="py-3 bg-black text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-gray-800 disabled:opacity-50 transition-all flex items-center justify-center gap-2 shadow-sm">
                        <i data-lucide="file-down" class="w-3.5 h-3.5"></i> Baixar
                    </button>
                    <button type="button" @click="deleteSelected()" :disabled="selectedScriptIds.length === 0"
                        class="py-3 bg-red-600 text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-red-700 disabled:opacity-50 transition-all flex items-center justify-center gap-2 shadow-sm">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Excluir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Overlay for Explorer -->
    <div x-show="showExplorer" @click="showExplorer = false" id="script-explorer-overlay"
        class="fixed inset-0 bg-black/5 backdrop-blur-sm transition-opacity transition-all duration-300" style="z-index: 9998;"
        x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100" x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
    </div>

    <!-- Empty State -->
    <div x-show="!activeScriptId && openScripts.length === 0"
        class="flex flex-col items-center justify-center py-40 animate-in fade-in zoom-in duration-500">
        <div
            class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-6 text-gray-200 group-hover:bg-white transition-all">
            <i data-lucide="scroll-text" class="w-10 h-10"></i>
        </div>
        <h3 class="text-xl font-serif font-black italic text-gray-900 mb-2">Nenhum script aberto</h3>
        <p class="text-sm text-gray-400 font-medium mb-8">Comece criando um script do zero ou use um de
            nossos templates.</p>
        <div class="flex items-center gap-4">
            <button type="button" @click="showTemplates = true"
                class="px-8 py-3.5 bg-white border border-gray-200 rounded-2xl text-sm font-black uppercase tracking-widest text-gray-900 hover:shadow-xl hover:shadow-gray-200/50 transition-all flex items-center gap-3 transform hover:-translate-y-1">
                <i data-lucide="layout" class="w-5 h-5 text-gray-400"></i>
                Usar um Template
            </button>
            <button type="button" @click="createNewScript"
                class="px-8 py-3.5 bg-[#fa0102] rounded-2xl text-sm font-black uppercase tracking-widest text-white hover:bg-black hover:shadow-xl hover:shadow-red-500/20 transition-all flex items-center gap-3 transform hover:-translate-y-1">
                <i data-lucide="plus" class="w-5 h-5"></i>
                Criar do Zero
            </button>
        </div>
    </div>

    <!-- Active Script Workspace -->
    <template x-if="activeScriptId">
        <div class="animate-in fade-in slide-in-from-bottom-2 duration-300">
            <!-- Metadata Bar -->
            <div class="bg-white border-b border-gray-100 px-6 py-3 flex items-center justify-between gap-6">
                <div class="flex items-center gap-6 flex-1 min-w-0">
                    <!-- Script Name -->
                    <div class="flex flex-col flex-1 min-w-[200px]">
                        <input type="text" x-model="currentScript.name"
                            @input="currentScript.dirty = true; saveToLocal()"
                            class="border-none p-0 focus:ring-0 text-lg font-black text-gray-900 placeholder-gray-300 bg-transparent"
                            placeholder="Nome do vídeo/projeto...">
                        <div class="flex items-center gap-2 mt-1">
                            <select x-model="currentScript.channel" @change="currentScript.dirty = true; saveToLocal()"
                                class="text-[10px] font-black uppercase tracking-widest text-gray-400 border-none p-0 bg-transparent focus:ring-0 cursor-pointer hover:text-gray-600">
                                <option value="Reels/Shorts">Reels/Shorts</option>
                                <option value="TikTok">TikTok</option>
                                <option value="YouTube">YouTube</option>
                                <option value="Instagram">Instagram</option>
                                <option value="LinkedIn">LinkedIn</option>
                                <option value="Ads">Ads</option>
                            </select>
                            <span class="w-1 h-1 bg-gray-200 rounded-full"></span>
                            <select x-model="currentScript.type" @change="currentScript.dirty = true; saveToLocal()"
                                class="text-[10px] font-black uppercase tracking-widest text-gray-400 border-none p-0 bg-transparent focus:ring-0 cursor-pointer hover:text-gray-600">
                                <option value="Conteúdo">Conteúdo</option>
                                <option value="Criativo">Criativo</option>
                                <option value="Vendas">Vendas</option>
                                <option value="Institucional">Institucional</option>
                            </select>
                        </div>
                    </div>

                    <div class="h-8 w-px bg-gray-100 flex-shrink-0"></div>

                    <!-- Duration & Objective -->
                    <div class="flex items-center gap-6 flex-1 min-w-0">
                        <div class="flex flex-col w-32 flex-shrink-0">
                            <span class="text-[8px] font-black uppercase tracking-widest text-gray-400 mb-1">Duração
                                Est.</span>
                            <input type="text" x-model="currentScript.duration"
                                @input="currentScript.dirty = true; saveToLocal()"
                                class="border-none p-0 focus:ring-0 text-sm font-bold text-red-600 placeholder-gray-300 bg-transparent"
                                placeholder="Ex: 45s">
                        </div>
                        <div class="flex flex-col flex-1 min-w-0">
                            <span class="text-[8px] font-black uppercase tracking-widest text-gray-400 mb-1">Objetivo
                                Estratégico</span>
                            <input type="text" x-model="currentScript.objective"
                                @input="currentScript.dirty = true; saveToLocal()"
                                class="border-none p-0 focus:ring-0 text-sm font-bold text-gray-700 placeholder-gray-300 bg-transparent"
                                placeholder="O que esse vídeo deve alcançar?">
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <div class="text-xs text-gray-400 font-medium mr-4">
                        Variações de Hooks: <span class="font-bold text-gray-900"
                            x-text="currentScript.hooks.length"></span>
                    </div>
                    <button type="button" @click="copyScript"
                        class="p-3 text-gray-400 hover:text-gray-900 hover:bg-gray-100 rounded-xl transition-all"
                        title="Copiar Script">
                        <i data-lucide="copy" class="w-4.5 h-4.5"></i>
                    </button>
                    <button type="button" @click="printScript" id="pdfBtn"
                        class="px-5 py-2.5 border border-gray-200 rounded-xl text-xs font-black uppercase tracking-widest text-gray-600 hover:bg-gray-50 transition-all flex items-center gap-2 shadow-sm disabled:opacity-50 disabled:cursor-wait">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span x-text="isPrinting ? 'Gerando...' : 'PDF'"></span>
                    </button>
                    <button type="button" @click="saveMain()"
                        class="px-5 py-2 rounded-lg text-sm font-bold transition-all"
                        :class="currentScript.dirty ? 'bg-[#E8191A] text-white hover:bg-red-700 shadow-lg shadow-red-500/20' : 'bg-gray-100 text-gray-400 cursor-default'">
                        Salvar
                    </button>
                </div>
            </div>

            <!-- Columns Workspace -->
            <div class="grid grid-cols-1 lg:grid-cols-3 min-h-[calc(100vh-140px)] bg-white">
                <!-- Column 1: Hooks -->
                <div class="px-8 py-10 border-r border-gray-100 bg-gradient-to-b from-[#FFF9F9] to-white">
                    <div class="flex items-center justify-between mb-10">
                        <div>
                            <div class="flex items-center gap-2 mb-2">
                                <span class="w-8 h-[2px] bg-[#fa0102]"></span>
                                <h4 class="text-[10px] font-black uppercase tracking-[0.2em] text-[#fa0102]">
                                    Passo 01</h4>
                            </div>
                            <h3 class="text-2xl font-serif font-black italic text-gray-900 tracking-tight">
                                Ganchos (Hooks)</h3>
                        </div>
                        <button type="button" @click="addHook"
                            class="w-10 h-10 rounded-xl bg-[#fa0102]/5 border border-[#fa0102]/10 text-[#fa0102] flex items-center justify-center hover:bg-[#fa0102] hover:text-white transition-all shadow-sm hover:shadow-red-500/20 transform hover:-translate-y-0.5">
                            <i data-lucide="plus" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <div class="space-y-6">
                        <template x-for="(hook, hIdx) in currentScript.hooks" :key="hIdx">
                            <div
                                class="group relative bg-white p-5 rounded-2xl border border-gray-100 transition-all hover:border-[#fa0102]/30 shadow-sm hover:shadow-xl hover:shadow-red-500/5">
                                <div class="flex items-center justify-between mb-4">
                                    <div class="flex items-center gap-3">
                                        <span
                                            class="w-7 h-7 rounded-lg bg-gradient-to-br from-[#fa0102] to-[#b90102] text-white text-[10px] font-black flex items-center justify-center shadow-md shadow-red-500/20"
                                            x-text="String.fromCharCode(64 + (hIdx+1))"></span>
                                        <span
                                            class="text-[9px] font-black uppercase tracking-[0.2em] text-gray-400">Variação</span>
                                    </div>
                                    <button type="button" @click="removeHook(hIdx)"
                                        x-show="currentScript.hooks.length > 1"
                                        class="text-gray-200 hover:text-red-500 transition-all transform hover:scale-110">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                                <textarea x-model="currentScript.hooks[hIdx]"
                                    @input="currentScript.dirty = true; saveToLocal()"
                                    class="w-full border-none p-0 focus:ring-0 text-gray-700 text-sm leading-relaxed placeholder-gray-300 bg-transparent resize-none font-medium"
                                    rows="2" placeholder="Digite uma variação de gancho atraente..."></textarea>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Column 2: Content Body -->
                <div class="px-8 py-10 border-r border-gray-100 bg-gradient-to-b from-[#F9FBFF] to-white">
                    <div class="flex items-center justify-between mb-10">
                        <div class="flex items-center gap-6">
                            <div>
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="w-8 h-[2px] bg-black"></span>
                                    <h4 class="text-[10px] font-black uppercase tracking-[0.2em] text-black">
                                        Passo 02</h4>
                                </div>
                                <h3 class="text-2xl font-serif font-black italic text-gray-900 tracking-tight">
                                    Roteiro & Cenário</h3>
                            </div>
                        </div>
                        <button type="button" @click="addSegment()"
                            class="w-10 h-10 rounded-xl bg-black/5 border border-black/10 text-black flex items-center justify-center hover:bg-black hover:text-white transition-all shadow-sm transform hover:-translate-y-0.5">
                            <i data-lucide="plus" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <div class="space-y-6">
                        <template x-for="(segment, sIdx) in currentScript.segments" :key="sIdx">
                            <div
                                class="bg-white rounded-3xl border border-gray-100 flex flex-col shadow-sm hover:shadow-xl transition-all hover:border-black/20 overflow-hidden">
                                <!-- Segment Header Toggle -->
                                <div
                                    class="flex items-center justify-between px-6 py-3 border-b border-gray-50 bg-gray-50/30">
                                    <div class="flex items-center gap-3">
                                        <span
                                            class="w-6 h-6 rounded-full bg-black text-white text-[9px] font-black flex items-center justify-center"
                                            x-text="sIdx + 1"></span>
                                        <span
                                            class="text-[9px] font-black uppercase tracking-widest text-gray-400">Bloco
                                            de Roteiro</span>
                                    </div>
                                    <div class="flex items-center gap-4">
                                        <div class="flex bg-gray-100 p-1 rounded-lg items-center">
                                            <button type="button" @click="segment.activeTab = 'voice'"
                                                class="px-3 py-1 rounded text-[8px] font-black uppercase tracking-widest transition-all"
                                                :class="segment.activeTab === 'voice' ? 'bg-white text-black shadow-sm' : 'text-gray-400'">
                                                Voz
                                            </button>
                                            <button type="button" @click="segment.activeTab = 'scene'"
                                                class="px-3 py-1 rounded text-[8px] font-black uppercase tracking-widest transition-all"
                                                :class="segment.activeTab === 'scene' ? 'bg-white text-black shadow-sm' : 'text-gray-400'">
                                                Cena
                                            </button>
                                        </div>
                                        <button type="button" @click="removeSegment(sIdx)"
                                            x-show="currentScript.segments.length > 1"
                                            class="text-gray-300 hover:text-red-500 transition-all">
                                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Segment Content -->
                                <div class="p-6">
                                    <div x-show="segment.activeTab === 'voice'"
                                        class="animate-in fade-in slide-in-from-left-1 duration-200">
                                        <textarea x-model="segment.voice"
                                            @input="currentScript.dirty = true; saveToLocal()"
                                            class="w-full border-none p-0 focus:ring-0 text-gray-700 text-sm leading-relaxed placeholder-gray-300 bg-transparent resize-none font-medium min-h-[100px]"
                                            placeholder="O que será dito nesta cena..."></textarea>
                                    </div>
                                    <div x-show="segment.activeTab === 'scene'"
                                        class="animate-in fade-in slide-in-from-right-1 duration-200">
                                        <textarea x-model="segment.scene"
                                            @input="currentScript.dirty = true; saveToLocal()"
                                            class="w-full border-none p-0 focus:ring-0 text-gray-900 text-sm leading-relaxed placeholder-gray-300 bg-transparent resize-none font-medium italic min-h-[100px]"
                                            placeholder="Como deve ser o enquadramento, iluminação e ação..."></textarea>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Column 3: CTA -->
                <div class="px-8 py-10 bg-gradient-to-b from-[#F9FFF9] to-white">
                    <div class="flex items-center justify-between mb-10">
                        <div>
                            <div class="flex items-center gap-2 mb-2">
